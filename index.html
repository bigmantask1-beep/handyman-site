<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт и услуги в {city}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Northline Handyman</div>
        <div class="phone">Звоните: <span class="highlight">{phone}</span></div>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Профессиональные строительные и ремонтные услуги в <span class="highlight">{city}</span></h1>
            <p>Быстро, качественно и с гарантией. Мы работаем для вас в городе {city}!</p>
            <button class="cta-button">Вызвать мастера</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
